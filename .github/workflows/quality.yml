name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: ruff check src tests

  tests-coverage:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml -o cobertura.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m compileall -q src tests
      - name: Run Windows tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unittest failure::$message"
            exit $exitCode
          }

  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: php -l relay/public/index.php
      - run: php -l relay/src/ProviderForwarder.php

  sonar-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PROJECT_KEY: csivr2ivr2-lgtm_agent-Windows
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Query authenticated SonarCloud issues for this PR
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ]; then
            printf '### SonarCloud diagnostic (temporary)\n\n`SONAR_TOKEN` is not configured as a repository secret.\n' > sonar-summary.md
            gh pr comment "$PR_NUMBER" --body-file sonar-summary.md
            exit 0
          fi
          auth_header="Authorization: Bearer $SONAR_TOKEN"
          issues_url="https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&resolved=false&ps=100"
          hotspots_url="https://sonarcloud.io/api/hotspots/search?projectKey=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&ps=100"
          curl --fail --silent --show-error --location -H "$auth_header" "$issues_url" -o sonar-issues.json
          curl --fail --silent --show-error --location -H "$auth_header" "$hotspots_url" -o sonar-hotspots.json || printf '{"hotspots":[]}\n' > sonar-hotspots.json
          python - <<'PY' > sonar-summary.md
          import json
          from pathlib import Path

          issues = json.loads(Path("sonar-issues.json").read_text())
          hotspots = json.loads(Path("sonar-hotspots.json").read_text())
          print("### SonarCloud diagnostic (temporary)")
          print()
          print(f"Open issues: {issues.get('total', len(issues.get('issues', [])))}")
          for item in issues.get("issues", []):
              component = item.get("component", "")
              path = component.split(":", 1)[-1]
              line = item.get("line", "?")
              severity = item.get("severity", item.get("impacts", "?"))
              issue_type = item.get("type", "?")
              rule = item.get("rule", "?")
              message = item.get("message", "")
              print(f"- **{severity} {issue_type}** `{path}:{line}` `{rule}` — {message}")
          hs = hotspots.get("hotspots", [])
          print()
          print(f"Security hotspots: {len(hs)}")
          for item in hs:
              component = item.get("component", "")
              path = component.split(":", 1)[-1]
              line = item.get("line", "?")
              status = item.get("status", "?")
              rule = item.get("ruleKey", "?")
              message = item.get("message", "")
              print(f"- **{status}** `{path}:{line}` `{rule}` — {message}")
          PY
          gh pr comment "$PR_NUMBER" --body-file sonar-summary.md
