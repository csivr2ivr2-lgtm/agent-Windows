name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: ruff check src tests

  tests-coverage:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml -o cobertura.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m compileall -q src tests
      - name: Validate installer PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @("scripts/installer-apply.ps1", "scripts/installer-remove.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $allErrors += $parseErrors | ForEach-Object { "${script}: $($_.Message)" }
            }
          }
          if ($allErrors.Count -gt 0) { throw ($allErrors -join "`n") }
      - name: Compile Windows launcher
        shell: pwsh
        run: |
          $icon = "assets\ai-aharon.ico"
          if (-not (Test-Path $icon)) {
            $encoded = (Get-Content "assets\ai-aharon.ico.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes($icon, [Convert]::FromBase64String($encoded))
          }
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          $output = Join-Path $env:RUNNER_TEMP "AI-Aharon-smoke.exe"
          & $csc /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /win32icon:$icon /out:$output installer\launcher.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) {
            throw "Launcher compilation failed"
          }
      - name: Run Windows tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unittest failure::$message"
            exit $exitCode
          }

  security-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run independent SAST diagnostics
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check bandit semgrep
          bandit -f json -o bandit.json \
            src/agent_windows/updater.py \
            src/agent_windows/settings_ui.py \
            src/agent_windows/desktop_gui.py \
            src/agent_windows/windows_service.py || true
          semgrep scan --config auto --json --output semgrep.json \
            .github/workflows/release.yml \
            installer/launcher.cs \
            scripts/installer-apply.ps1 \
            scripts/installer-remove.ps1 \
            src/agent_windows/updater.py \
            src/agent_windows/settings_ui.py \
            src/agent_windows/desktop_gui.py \
            src/agent_windows/windows_service.py || true
          curl -fsS \
            "https://api.codacy.com/api/v3/analysis/organizations/gh/csivr2ivr2-lgtm/repositories/agent-Windows/pull-requests/2/issues?limit=100" \
            -o codacy.json || printf '{"data":[]}' > codacy.json
      - name: Post SAST diagnostic on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lines = ["### Independent SAST diagnostic (temporary)", ""]
          try:
              bandit = json.loads(Path("bandit.json").read_text())
              findings = bandit.get("results", [])
          except Exception as exc:
              findings = []
              lines.append(f"Bandit report error: {exc}")
          lines.append(f"**Bandit:** {len(findings)} findings")
          for item in findings[:40]:
              lines.append(
                  f"- `{item.get('issue_severity')}/{item.get('issue_confidence')}` "
                  f"`{item.get('test_id')}` {item.get('filename')}:{item.get('line_number')} — "
                  f"{item.get('issue_text')}"
              )

          try:
              semgrep = json.loads(Path("semgrep.json").read_text())
              results = semgrep.get("results", [])
          except Exception as exc:
              results = []
              lines.append(f"Semgrep report error: {exc}")
          lines.extend(["", f"**Semgrep:** {len(results)} findings"])
          order = {"ERROR": 0, "WARNING": 1, "INFO": 2}
          results.sort(key=lambda r: order.get(r.get("extra", {}).get("severity", "INFO"), 9))
          for item in results[:80]:
              extra = item.get("extra", {})
              start = item.get("start", {})
              lines.append(
                  f"- `{extra.get('severity', 'INFO')}` `{item.get('check_id')}` "
                  f"{item.get('path')}:{start.get('line')} — {extra.get('message', '').replace(chr(10), ' ')[:500]}"
              )

          try:
              codacy = json.loads(Path("codacy.json").read_text())
              added = [item for item in codacy.get("data", []) if item.get("deltaType") == "Added"]
          except Exception as exc:
              added = []
              lines.append(f"Codacy public API error: {exc}")
          lines.extend(["", f"**Codacy Added issues:** {len(added)}"])
          for item in added[:80]:
              issue = item.get("commitIssue", {}) or {}
              pattern = issue.get("patternInfo", {}) or {}
              lines.append(
                  f"- `{pattern.get('level', '?')}` `{pattern.get('id', '?')}` "
                  f"{issue.get('filePath', '?')}:{issue.get('lineNumber', '?')} — "
                  f"{str(issue.get('message', '')).replace(chr(10), ' ')[:500]}"
              )

          Path("sast-comment.md").write_text("\n".join(lines)[:60000], encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file sast-comment.md

  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: php -l relay/public/index.php
      - run: php -l relay/src/ProviderForwarder.php
