name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: ruff check src tests

  tests-coverage:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml -o cobertura.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m compileall -q src tests
      - name: Run Windows tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unittest failure::$message"
            exit $exitCode
          }

  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: php -l relay/public/index.php
      - run: php -l relay/src/ProviderForwarder.php

  codacy-security-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read Codacy security findings for this repository
        if: env.CODACY_PROJECT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            'https://app.codacy.com/api/v3/analysis/organizations/gh/csivr2ivr2-lgtm/repositories/agent-Windows/issues/search?limit=1000' \
            -H "project-token: $CODACY_PROJECT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"categories":["Security"]}' \
            > codacy-security.json

          jq --arg sha "$HEAD_SHA" '
            [.data[] | {
              pattern: (.patternInfo.id // .patternInfo.title // "unknown"),
              level: (.patternInfo.level // .level // "unknown"),
              file: (.filePath // ""),
              line: (.lineNumber // .line // .location.line // null),
              sha: (.commitInfo.sha // .commitInfo.commitSha // .commitSha // ""),
              message: (.message // .patternInfo.title // "")
            }] as $all
            | ($all | map(select(.sha == $sha))) as $head
            | if ($head | length) > 0 then $head else $all end
            | .[:40]
          ' codacy-security.json > codacy-security-summary.json

          {
            echo '### Temporary Codacy security diagnostic'
            echo
            echo "Head: \`$HEAD_SHA\`"
            echo
            echo '```json'
            cat codacy-security-summary.json
            echo '```'
          } > codacy-comment.md
          gh pr comment "$PR_NUMBER" --body-file codacy-comment.md
