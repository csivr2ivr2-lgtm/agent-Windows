name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: ruff check src tests

  tests-coverage:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml -o cobertura.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m compileall -q src tests
      - name: Run Windows tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unittest failure::$message"
            exit $exitCode
          }

  windows-diagnostic:
    name: windows-diag-${{ matrix.group }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            patterns: "test_agent_context_capabilities.py,test_agent_loop.py,test_audio.py,test_cli_diagnostics.py,test_computer_use.py,test_core.py"
          - group: gui
            patterns: "test_desktop_gui_runtime.py,test_final_checks.py,test_finalizer_script.py,test_gui_polish.py,test_local_tts.py,test_phone_gui.py,test_session_agent_runtime.py,test_windows_service_runtime.py"
          - group: integrations
            patterns: "test_hardening.py,test_hermes_skills.py,test_integrations.py,test_livekit_agent.py,test_livekit_runtime.py,test_local_realtime.py"
          - group: models
            patterns: "test_model_fit.py,test_model_lab.py,test_mvp.py,test_needle_integration.py,test_omniroute_policy.py,test_openhuman_goals.py,test_openviking_memory.py,test_ponytail.py"
          - group: services
            patterns: "test_provider_checks.py,test_provider_manager.py,test_providers.py,test_realtime_diagnostics.py,test_realtime_milestone.py,test_security.py,test_service_api.py,test_service_api_edges.py"
          - group: streaming
            patterns: "test_speech_edges.py,test_spoken_text.py,test_streaming_agent_loop.py,test_streaming_llm.py,test_streaming_stt.py,test_tts_streaming.py,test_ufo_isolated.py,test_voice_runtime_edges.py,test_web_tools.py"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run diagnostic group
        shell: pwsh
        run: |
          $patterns = "${{ matrix.patterns }}".Split(",")
          foreach ($pattern in $patterns) {
            Write-Host "=== $pattern ==="
            & python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: php -l relay/public/index.php
      - run: php -l relay/src/ProviderForwarder.php
