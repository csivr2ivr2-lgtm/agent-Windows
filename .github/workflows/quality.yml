name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: ruff check src tests

  tests-coverage:
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml -o cobertura.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cobertura.xml

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --requirement scripts/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m compileall -q src tests
      - name: Run Windows tests
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unittest failure::$message"
            exit $exitCode
          }

  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: php -l relay/public/index.php
      - run: php -l relay/src/ProviderForwarder.php

  codacy-security-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install Codacy Cloud CLI
        if: env.CODACY_PROJECT_TOKEN != ''
        run: npm install -g @codacy/codacy-cloud-cli@1.9.0

      - name: Report Codacy security issues
        if: env.CODACY_PROJECT_TOKEN != ''
        shell: bash
        run: |
          set +e
          codacy issues gh csivr2ivr2-lgtm agent-Windows \
            --branch installer-updater \
            --categories Security \
            --output json \
            > codacy-security.txt 2>&1
          status=$?
          codacy issues --help > codacy-help.txt 2>&1
          {
            echo '### Temporary Codacy security diagnostic'
            echo
            echo "Command exit code: $status"
            echo
            echo '```text'
            head -n 160 codacy-security.txt
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo
              echo '#### CLI help'
              echo '```text'
              head -n 160 codacy-help.txt
              echo '```'
            fi
          } > codacy-comment.md
          gh pr comment "$PR_NUMBER" --body-file codacy-comment.md
          exit 0
