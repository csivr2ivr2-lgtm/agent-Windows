[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-windows"
version = "0.1.0"
description = "A lightweight, provider-agnostic personal AI agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pywin32==312; platform_system == 'Windows'",
  "websockets==17.0.1",
]

[project.scripts]
agent-windows = "agent_windows.__main__:main"
ai-aharon-livekit = "agent_windows.livekit_runtime:main"

[project.optional-dependencies]
dev = ["coverage[toml]==7.13.3", "ruff==0.9.10"]
realtime = ["livekit-agents[assemblyai,deepgram,elevenlabs]==1.7.0"]
needle = ["cactus-needle==2.0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B006", "B008"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/agent_windows"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '\.\.\.$',
]
